<article
  class="flex flex-col rounded-xl border border-secondary-100 bg-white p-6 shadow-sm transition-shadow hover:shadow-md"
>
  <span class="text-3xl" aria-hidden="true">{{ icon() }}</span>
  <h3 class="mt-3 text-sm font-semibold text-secondary-900">{{ title() }}</h3>
  <p class="mt-1 text-sm leading-relaxed text-secondary-500">{{ description() }}</p>
</article>
